<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline | PARTI 2026 Himatif UMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0c0d0e;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border-line: rgba(255, 255, 255, 0.12);
            --text-ink: #f3f4f6;
            --text-soft: #9ca3af;
            --ember: #e65100;
            --ember-glow: rgba(230, 81, 0, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Aurora Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            opacity: 0.6;
        }
        .orb-1 {
            width: 350px;
            height: 350px;
            top: -10%;
            right: -10%;
            background: radial-gradient(circle, var(--ember-glow) 0%, transparent 70%);
        }
        .orb-2 {
            width: 300px;
            height: 300px;
            bottom: -10%;
            left: -10%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.2) 0%, transparent 70%);
        }

        .card {
            position: relative;
            z-index: 10;
            max-width: 420px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-line);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .logo {
            height: 64px;
            width: auto;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 4px 12px rgba(230, 81, 0, 0.4));
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--ember);
            background: rgba(230, 81, 0, 0.1);
            border: 1px solid rgba(230, 81, 0, 0.3);
            padding: 4px 12px;
            border-radius: 100px;
            margin-bottom: 1rem;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--ember);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
        }

        p {
            font-size: 0.875rem;
            color: var(--text-soft);
            line-height: 1.6;
            margin-bottom: 1.75rem;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.85rem 1.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, var(--ember), #c63f00);
            border: none;
            border-radius: 100px;
            cursor: pointer;
            box-shadow: 0 8px 20px -4px rgba(230, 81, 0, 0.5);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -4px rgba(230, 81, 0, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="card">
        <img src="/logo.png" alt="Logo PARTI" class="logo">
        <br>
        <div class="badge">
            <span class="badge-dot"></span>
            Mode Offline
        </div>
        <h1>Tidak Ada Koneksi Internet</h1>
        <p>Perangkat Anda sedang offline atau koneksi terputus. Silakan periksa jaringan internet Anda dan coba lagi.</p>
        <button class="btn" onclick="window.location.reload()">Coba Muat Ulang</button>
    </div>
</body>
</html>
